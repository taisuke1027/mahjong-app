<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>積立運動口座</title>
<meta name="description" content="運動を身体への投資と捉え、身体資産を積み立てていくトレーニング記録アプリ" />
<meta name="theme-color" content="#F6F1E6" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="積立運動口座" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="splashScreen">
  <div class="splash-content">
    <div class="splash-mark">積</div>
    <div class="splash-title">積立運動口座</div>
    <!-- しばまるが走るコマ送りアニメーション（8枚のPNGを順番に切り替え） -->
    <img id="splashMascot" src="mascot-run-01.png" alt="しばまる" class="splash-mascot" />
    <div class="splash-loading">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>


<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="mark">積</span>
      <span class="title">積立運動口座</span>
    </div>
    <div class="season-chip" id="seasonChip">Season 1</div>
  </header>

  <main class="view" id="mainView"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-view="home"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9v-6h6v6h2.5a1 1 0 0 0 1-1V10"/></svg></span>ホーム</button>
    <button data-view="asset"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12M10 20V6M16 20v-9M2 20h20"/></svg></span>運動記録</button>
    <button data-view="more"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>その他</button>
  </nav>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<!-- データ層 -->
<script src="config.js"></script>
<script src="exercises.js"></script>
<script src="tips.js"></script>
<script src="praises.js"></script>
<script src="mascot.js"></script>
<script src="models.js"></script>
<script src="storage.js"></script>
<script src="gameBalance.js"></script>

<!-- 計算エンジン -->
<script src="cardioCalculator.js"></script>
<script src="strengthCalculator.js"></script>
<script src="enduranceCalculator.js"></script>
<script src="decayCalculator.js"></script>
<script src="habitCalculator.js"></script>
<script src="bptCalculator.js"></script>
<script src="seasonManager.js"></script>

<!-- UI -->
<script src="format.js"></script>
<script src="icons.js"></script>
<script src="chart.js"></script>
<script src="picker.js"></script>
<script src="confirm.js"></script>
<script src="home.js"></script>
<script src="bptInfo.js"></script>
<script src="pressureInfo.js"></script>
<script src="habitInfo.js"></script>
<script src="assetRankInfo.js"></script>
<script src="record.js"></script>
<script src="exercisePicker.js"></script>
<script src="template.js"></script>
<script src="result.js"></script>
<script src="levelUpView.js"></script>
<script src="edit.js"></script>
<script src="asset.js"></script>
<script src="seasons.js"></script>
<script src="science.js"></script>
<script src="gameBalanceSettings.js"></script>
<script src="more.js"></script>
<script src="router.js"></script>
<script src="app.js"></script>
</body>
</html>
